<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>🐠 Peces AR</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MIND AR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #061827;
      font-family: Arial, sans-serif;
    }

    /* Pantalla inicial */

    #inicio {

      position: fixed;

      z-index: 9999;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      color: white;

      background:
        linear-gradient(
          180deg,
          #062c48,
          #031522
        );

      padding: 25px;

      box-sizing: border-box;
    }

    #inicio .caja {

      max-width: 430px;
    }

    #inicio h1 {

      font-size: 34px;

      margin: 0 0 12px;
    }

    #inicio p {

      font-size: 17px;

      line-height: 1.5;

      opacity: .9;
    }

    /* Botón */

    #boton {

      border: 0;

      border-radius: 30px;

      padding: 15px 28px;

      font-size: 18px;

      font-weight: bold;

      color: white;

      background: #08a8df;

      cursor: pointer;
    }

    /* Mensaje inferior */

    #ayuda {

      position: fixed;

      z-index: 9998;

      left: 50%;

      bottom: 20px;

      transform: translateX(-50%);

      background: rgba(0,0,0,.65);

      color: white;

      padding: 10px 16px;

      border-radius: 20px;

      font-size: 14px;

      text-align: center;

      display: none;

    }

  </style>


  <script>

    /*
      ==========================================
      COMPONENTE PEZ NADANDO
      ==========================================
    */

    AFRAME.registerComponent(
      'pez-nadando',
      {

        schema: {

          distancia: {
            type: 'number',
            default: 1.8
          },

          duracion: {
            type: 'number',
            default: 4500
          }

        },


        init: function () {

          const el = this.el;

          const d = this.data;


          /*
            Movimiento horizontal
          */

          el.setAttribute(
            'animation__nadar',
            {

              property: 'position',

              from:
                `${-d.distancia} 0 0`,

              to:
                `${d.distancia} 0 0`,

              dur: d.duracion,

              easing: 'linear',

              loop: true,

              dir: 'alternate'

            }
          );


          /*
            Pequeño movimiento
            vertical del pez
          */

          el.setAttribute(
            'animation__girar',
            {

              property: 'rotation',

              from: '0 0 4',

              to: '0 0 -4',

              dur: 900,

              easing: 'easeInOutSine',

              loop: true,

              dir: 'alternate'

            }
          );

        }

      }
    );


    /*
      ==========================================
      COMPONENTE BURBUJA
      ==========================================
    */

    AFRAME.registerComponent(
      'burbuja',
      {

        schema: {

          altura: {

            type: 'number',

            default: 1.5

          },

          duracion: {

            type: 'number',

            default: 3000

          }

        },


        init: function () {

          const p =
            this.el.getAttribute(
              'position'
            );


          this.el.setAttribute(
            'animation',
            {

              property: 'position',

              from:
                `${p.x} ${p.y} ${p.z}`,

              to:
                `${p.x} ${p.y + this.data.altura} ${p.z}`,

              dur: this.data.duracion,

              easing: 'easeOutQuad',

              loop: true

            }
          );

        }

      }
    );

  </script>

</head>


<body>


  <!-- ======================================
       PANTALLA INICIAL
       ====================================== -->

  <div id="inicio">

    <div class="caja">

      <h1>
        🐠 PECES AR
      </h1>

      <p>

        Apunta la cámara hacia
        la imagen objetivo.

        Cuando la reconozca
        aparecerán peces nadando
        junto con burbujas.

      </p>


      <button id="boton">

        ACTIVAR CÁMARA

      </button>


      <p style="font-size:13px">

        La cámara requiere HTTPS
        o localhost.

      </p>

    </div>

  </div>


  <!-- ======================================
       MENSAJE DE AYUDA
       ====================================== -->

  <div id="ayuda">

    Busca la imagen objetivo
    frente a la cámara.

  </div>


  <!-- ======================================
       ESCENA DE REALIDAD AUMENTADA
       ====================================== -->

  <a-scene

    id="escena"

    mindar-image="

      imageTargetSrc:./targets.mind;

      autoStart: false;

      uiScanning: no;

      uiLoading: no;

    "

    color-space="sRGB"

    renderer="
      colorManagement: true,
      physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="
      enabled: false
    "
  >


    <!-- ======================================
         ILUMINACIÓN
         ====================================== -->

    <a-light

      type="ambient"

      color="#ffffff"

      intensity="2">
      
    </a-light>


    <a-light

      type="directional"

      position="1 2 3"

      intensity="1.5">

    </a-light>


    <!-- ======================================
         CÁMARA
         ====================================== -->

    <a-camera

      position="0 0 0"

      look-controls="
        enabled: false
      ">

    </a-camera>


    <!-- ======================================
         MARCADOR
         ====================================== -->

    <a-entity

      id="objetivo"

      mindar-image-target="
        targetIndex: 0
      "
    >


      <!-- ====================================
           FONDO MARINO
           ==================================== -->

      <a-plane

        color="#087ea4"

        opacity="0.18"

        width="1"

        height="0.552"

        position="0 0 -0.05">

      </a-plane>


      <!-- ====================================
           PEZ NÚMERO 1
           NARANJA
           ==================================== -->

      <a-entity

        pez-nadando="
          distancia: 1.3;
          duracion: 4200
        "

        position="0 0.15 0.2"

        scale="0.42 0.42 0.42"
      >


        <!-- Cuerpo -->

        <a-sphere

          color="#ff7b00"

          radius=".28"

          scale="1.5 .75 .55">

        </a-sphere>


        <!-- Cola -->

        <a-cone

          color="#ff9d2e"

          radius-bottom=".22"

          radius-top="0"

          height=".42"

          rotation="0 0 -90"

          position="-.47 0 0">

        </a-cone>


        <!-- Ojo -->

        <a-sphere

          color="#111111"

          radius=".045"

          position=".30 .08 .24">

        </a-sphere>


        <!-- Aleta -->

        <a-cone

          color="#e85f00"

          radius-bottom=".13"

          radius-top="0"

          height=".25"

          position="0 .22 0">

        </a-cone>

      </a-entity>


      <!-- ====================================
           PEZ NÚMERO 2
           AZUL
           ==================================== -->

      <a-entity

        pez-nadando="
          distancia: 1.5;
          duracion: 5600
        "

        position="0 -0.10 0.3"

        scale="0.32 0.32 0.32"
      >


        <!-- Cuerpo -->

        <a-sphere

          color="#1478e8"

          radius=".3"

          scale="1.5 .75 .55">

        </a-sphere>


        <!-- Cola -->

        <a-cone

          color="#0c55b4"

          radius-bottom=".23"

          radius-top="0"

          height=".45"

          rotation="0 0 -90"

          position="-.5 0 0">

        </a-cone>


        <!-- Ojo -->

        <a-sphere

          color="#111111"

          radius=".045"

          position=".31 .08 .24">

        </a-sphere>


        <!-- Aleta -->

        <a-cone

          color="#2e9cff"

          radius-bottom=".13"

          radius-top="0"

          height=".25"

          position="0 .23 0">

        </a-cone>

      </a-entity>


      <!-- ====================================
           PEZ NÚMERO 3
           AMARILLO
           ==================================== -->

      <a-entity

        pez-nadando="
          distancia: 1.1;
          duracion: 3500
        "

        position="0 0.28 0.1"

        scale="0.25 0.25 0.25"
      >


        <!-- Cuerpo -->

        <a-sphere

          color="#ffd400"

          radius=".3"

          scale="1.5 .75 .55">

        </a-sphere>


        <!-- Cola -->

        <a-cone

          color="#e8b900"

          radius-bottom=".22"

          radius-top="0"

          height=".42"

          rotation="0 0 -90"

          position="-.48 0 0">

        </a-cone>


        <!-- Ojo -->

        <a-sphere

          color="#111111"

          radius=".045"

          position=".31 .08 .24">

        </a-sphere>

      </a-entity>


      <!-- ====================================
           BURBUJAS
           ==================================== -->

      <a-sphere

        burbuja

        color="#bfefff"

        opacity=".65"

        radius=".035"

        position="-.35 -.20 .1">

      </a-sphere>


      <a-sphere

        burbuja

        color="#ffffff"

        opacity=".55"

        radius=".025"

        position=".10 -.15 .1"

        animation-delay="700">

      </a-sphere>


      <a-sphere

        burbuja

        color="#bfefff"

        opacity=".6"

        radius=".045"

        position=".35 -.22 .1"

        animation-delay="1200">

      </a-sphere>


      <a-sphere

        burbuja

        color="#ffffff"

        opacity=".55"

        radius=".025"

        position=".55 -.18 .1"

        animation-delay="1600">

      </a-sphere>


      <!-- ====================================
           TEXTO
           ==================================== -->

      <a-text

        value="🐠 PECES AR"

        align="center"

        color="#ffffff"

        width="1.7"

        position="0 -0.35 .2">

      </a-text>


    </a-entity>

  </a-scene>


  <!-- ======================================
       JAVASCRIPT
       ====================================== -->

  <script>

    const boton =
      document.getElementById(
        'boton'
      );


    const inicio =
      document.getElementById(
        'inicio'
      );


    const ayuda =
      document.getElementById(
        'ayuda'
      );


    const escena =
      document.getElementById(
        'escena'
      );


    const objetivo =
      document.getElementById(
        'objetivo'
      );


    /*
      ======================================
      ACTIVAR CÁMARA
      ======================================
    */

    boton.addEventListener(
      'click',
      async () => {

        inicio.style.display =
          'none';


        ayuda.style.display =
          'block';


        const sistema =
          escena.systems[
            'mindar-image-system'
          ];


        try {

          await sistema.start();

        }

        catch (error) {

          console.error(
            error
          );


          inicio.style.display =
            'flex';


          ayuda.style.display =
            'none';


          alert(

            'No se pudo iniciar la cámara. ' +

            'Comprueba que estás usando HTTPS ' +

            'o localhost y que diste permiso ' +

            'a la cámara.'

          );

        }

      }
    );


    /*
      ======================================
      CUANDO ENCUENTRA EL MARCADOR
      ======================================
    */

    objetivo.addEventListener(
      'targetFound',
      () => {

        ayuda.innerHTML =
          '🐠 ¡OBJETIVO ENCONTRADO! ' +
          'Disfruta los peces 🫧';

      }
    );


    /*
      ======================================
      CUANDO PIERDE EL MARCADOR
      ======================================
    */

    objetivo.addEventListener(
      'targetLost',
      () => {

        ayuda.innerHTML =
          'Busca nuevamente la ' +
          'imagen objetivo frente ' +
          'a la cámara.';

      }
    );

  </script>


</body>

</html>
