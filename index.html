<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>🐠 Peces AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Animaciones de modelos GLB -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.1/dist/aframe-extras.min.js"></script>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #001b2e;
            font-family: Arial, sans-serif;
        }

        #inicio {
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(0, 30, 55, 0.95),
                    rgba(0, 10, 25, 0.98)
                );

            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #inicio h1 {
            font-size: 32px;
            margin: 10px 0;
        }

        #inicio p {
            font-size: 18px;
            max-width: 360px;
            line-height: 1.5;
        }

        #boton {
            margin-top: 25px;
            padding: 16px 30px;

            border: none;
            border-radius: 40px;

            background: #00a8ff;
            color: white;

            font-size: 18px;
            font-weight: bold;

            box-shadow: 0 5px 20px rgba(0, 168, 255, 0.4);

            cursor: pointer;
        }

        #boton:active {
            transform: scale(0.95);
        }

        #mensaje {
            position: fixed;
            z-index: 9998;

            left: 50%;
            bottom: 35px;

            transform: translateX(-50%);

            width: 85%;
            max-width: 400px;

            padding: 15px;

            box-sizing: border-box;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            border-radius: 20px;

            text-align: center;

            font-size: 17px;

            display: none;
        }

        #cargando {
            position: fixed;
            z-index: 9997;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            background: rgba(0, 0, 0, 0.65);

            padding: 10px 18px;

            border-radius: 20px;

            display: none;
        }

    </style>
</head>


<body>


<!-- ========================================================= -->
<!-- PANTALLA INICIAL                                          -->
<!-- ========================================================= -->

<div id="inicio">

    <div style="font-size:70px;">
        🐠
    </div>

    <h1>PECES AR</h1>

    <p>
        Apunta la cámara hacia la imagen del acuario
        para descubrir los peces en realidad aumentada.
    </p>

    <button id="boton">
        📷 ACTIVAR CÁMARA
    </button>

</div>


<!-- ========================================================= -->
<!-- MENSAJE                                                    -->
<!-- ========================================================= -->

<div id="mensaje">
    🐠 ¡IMAGEN ENCONTRADA!<br>
    Disfruta los peces nadando 🐟🫧
</div>


<div id="cargando">
    Cargando peces...
</div>


<!-- ========================================================= -->
<!-- ESCENA AR                                                  -->
<!-- ========================================================= -->

<a-scene

    id="escena"

    mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: false;
        uiScanning: no;
        uiLoading: no;
        filterMinCF: 0.0001;
        filterBeta: 0.001;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
        antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded

    loading-screen="enabled: false"

>


    <!-- ===================================================== -->
    <!-- MODELOS 3D                                             -->
    <!-- ===================================================== -->

    <a-assets timeout="30000">

        <!-- PEZ 1 -->
        <a-asset-item
            id="pez1"
            src="./pez1.glb">
        </a-asset-item>

        <!-- PEZ 2 -->
        <a-asset-item
            id="pez2"
            src="./pez2.glb">
        </a-asset-item>

        <!-- PEZ 3 -->
        <a-asset-item
            id="pez3"
            src="./pez3.glb">
        </a-asset-item>

    </a-assets>


    <!-- ===================================================== -->
    <!-- ILUMINACIÓN                                             -->
    <!-- ===================================================== -->

    <a-light
        type="ambient"
        intensity="2">
    </a-light>

    <a-light
        type="directional"
        position="0 2 2"
        intensity="1.5">
    </a-light>


    <!-- ===================================================== -->
    <!-- OBJETIVO DE LA IMAGEN                                  -->
    <!-- ===================================================== -->

    <a-entity
        mindar-image-target="targetIndex: 0">


        <!-- ================================================= -->
        <!-- PEZ 1                                               -->
        <!-- ================================================= -->

        <a-gltf-model

            id="pezGrande"

            src="#pez1"

            position="-0.8 0.25 0.15"

            rotation="0 90 0"

            scale="0.35 0.35 0.35"

            animation-mixer

            animation__nadar="
                property: position;
                from: -0.9 0.25 0.15;
                to: 0.9 0.25 0.15;
                dur: 7000;
                easing: easeInOutSine;
                loop: true;
                dir: alternate;
            "

        ></a-gltf-model>


        <!-- ================================================= -->
        <!-- PEZ 2                                               -->
        <!-- ================================================= -->

        <a-gltf-model

            id="pezAzul"

            src="#pez2"

            position="0.7 0.55 0.1"

            rotation="0 -90 0"

            scale="0.27 0.27 0.27"

            animation-mixer

            animation__nadar="
                property: position;
                from: 0.9 0.55 0.1;
                to: -0.8 0.55 0.1;
                dur: 8500;
                easing: easeInOutSine;
                loop: true;
                dir: alternate;
            "

        ></a-gltf-model>


        <!-- ================================================= -->
        <!-- PEZ 3                                               -->
        <!-- ================================================= -->

        <a-gltf-model

            id="pezPequeno"

            src="#pez3"

            position="-0.4 -0.35 0.2"

            rotation="0 90 0"

            scale="0.20 0.20 0.20"

            animation-mixer

            animation__nadar="
                property: position;
                from: -0.7 -0.35 0.2;
                to: 0.8 -0.35 0.2;
                dur: 6000;
                easing: easeInOutSine;
                loop: true;
                dir: alternate;
            "

        ></a-gltf-model>


        <!-- ================================================= -->
        <!-- PEZ 4 - SEGUNDO RECORRIDO                          -->
        <!-- ================================================= -->

        <a-gltf-model

            src="#pez2"

            position="0 0 0.25"

            rotation="0 90 0"

            scale="0.16 0.16 0.16"

            animation-mixer

            animation__nadar="
                property: position;
                from: -1 -0.05 0.25;
                to: 1 -0.05 0.25;
                dur: 10000;
                easing: easeInOutSine;
                loop: true;
                dir: alternate;
            "

        ></a-gltf-model>


        <!-- ================================================= -->
        <!-- BURBUJAS                                           -->
        <!-- ================================================= -->

        <a-sphere
            position="-0.7 -0.5 0.15"
            radius="0.025"
            color="#ffffff"
            opacity="0.8"

            animation="
                property: position;
                from: -0.7 -0.5 0.15;
                to: -0.65 0.8 0.15;
                dur: 5000;
                loop: true;
                easing: linear;
            "
        ></a-sphere>


        <a-sphere
            position="0.3 -0.4 0.15"
            radius="0.018"
            color="#ffffff"
            opacity="0.8"

            animation="
                property: position;
                from: 0.3 -0.4 0.15;
                to: 0.35 0.9 0.15;
                dur: 6500;
                loop: true;
                easing: linear;
            "
        ></a-sphere>


        <a-sphere
            position="0.75 -0.3 0.15"
            radius="0.03"
            color="#ffffff"
            opacity="0.75"

            animation="
                property: position;
                from: 0.75 -0.3 0.15;
                to: 0.65 0.9 0.15;
                dur: 7000;
                loop: true;
                easing: linear;
            "
        ></a-sphere>


        <a-sphere
            position="-0.2 -0.2 0.15"
            radius="0.015"
            color="#ffffff"
            opacity="0.7"

            animation="
                property: position;
                from: -0.2 -0.2 0.15;
                to: -0.1 0.7 0.15;
                dur: 4500;
                loop: true;
                easing: linear;
            "
        ></a-sphere>


    </a-entity>


    <!-- ===================================================== -->
    <!-- CÁMARA                                                 -->
    <!-- ===================================================== -->

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>


</a-scene>


<!-- ========================================================= -->
<!-- JAVASCRIPT                                                -->
<!-- ========================================================= -->

<script>

    const boton = document.getElementById("boton");

    const inicio = document.getElementById("inicio");

    const mensaje = document.getElementById("mensaje");

    const cargando = document.getElementById("cargando");

    const escena = document.getElementById("escena");


    /* ======================================================= */
    /* ACTIVAR CÁMARA                                          */
    /* ======================================================= */

    boton.addEventListener("click", async function () {

        inicio.style.display = "none";

        cargando.style.display = "block";

        try {

            const mindarSystem =
                escena.systems["mindar-image-system"];

            if (mindarSystem) {

                await mindarSystem.start();

            }

            cargando.style.display = "none";

        }

        catch (error) {

            console.error(error);

            cargando.innerHTML =
                "❌ No se pudo activar la cámara.";

        }

    });


    /* ======================================================= */
    /* CUANDO SE ENCUENTRA LA IMAGEN                           */
    /* ======================================================= */

    escena.addEventListener(
        "targetFound",
        function () {

            mensaje.style.display = "block";

            setTimeout(function () {

                mensaje.style.display = "none";

            }, 4000);

        }
    );


    /* ======================================================= */
    /* CUANDO SE PIERDE LA IMAGEN                              */
    /* ======================================================= */

    escena.addEventListener(
        "targetLost",
        function () {

            console.log(
                "Imagen objetivo perdida"
            );

        }
    );


    /* ======================================================= */
    /* CONTROL DE ERRORES                                      */
    /* ======================================================= */

    escena.addEventListener(
        "arError",
        function (event) {

            console.error(
                "Error AR:",
                event
            );

        }
    );


</script>


</body>

</html>
